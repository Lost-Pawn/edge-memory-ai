[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-memory-ai"
version = "0.1.0"
description = "AI-Powered Edge Memory & Intelligence Platform (Qdrant Edge, offline-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team EdgeMemoryAi" }]

dependencies = [
    "qdrant-edge-py>=0.1.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "typer>=0.12.0",
    "tenacity>=9.0.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.3.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
edge-memory = "edge_memory.cli:app"
cloud-sync = "cloud_sync.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_memory", "src/cloud_sync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=edge_memory --cov=cloud_sync --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]
